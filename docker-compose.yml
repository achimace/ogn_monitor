services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ogn_monitor
      POSTGRES_USER: ${DB_USER:-ogn_monitor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backups:/backups
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ogn_monitor}"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru --save 300 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: ./app
    command: python -m app.worker
    environment: &app-env
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-ogn_monitor}:${DB_PASSWORD}@postgres:5432/ogn_monitor
      REDIS_URL: redis://redis:6379
      OGN_CALLSIGN: ${OGN_CALLSIGN:-OGNMON}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s
    deploy:
      replicas: 1  # SINGLETON - niemals mehr als 1!

  # VF-Sync worker (Vereinsflieger integration). Same image as worker/api,
  # opt-in via profile: `docker compose --profile vfsync up -d vfsync`.
  # Consumes Redis events only - never a second APRS worker.
  vfsync:
    build: ./app
    command: python -m app.vfsync
    profiles: ["vfsync"]
    environment:
      <<: *app-env
      VFSYNC_ENABLED: ${VFSYNC_ENABLED:-true}
      # Worker refuses to start without it (app/app/vfsync/main.py); must not
      # be ":?" - that would break every compose call, incl. deploy.sh.
      VFSYNC_CRED_KEY: ${VFSYNC_CRED_KEY:-}
      VFSYNC_HEALTH_PORT: ${VFSYNC_HEALTH_PORT:-8090}
      VFSYNC_ALERT_NTFY_URL: ${VFSYNC_ALERT_NTFY_URL:-}
      VFSYNC_ALERT_EMAIL_TO: ${VFSYNC_ALERT_EMAIL_TO:-}
      VFSYNC_TIMEZONE: ${VFSYNC_TIMEZONE:-Europe/Berlin}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://localhost:%s/healthz' % os.environ.get('VFSYNC_HEALTH_PORT','8090'))"]
      interval: 30s
      retries: 3
      start_period: 30s

  api:
    build: ./app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-4}
    environment:
      <<: *app-env
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      # VF-Sync: the API encrypts tenant credentials (PUT /api/vfsync/config)
      # and the operator CLI (python -m app.vfsync.tools) runs in this image
      VFSYNC_CRED_KEY: ${VFSYNC_CRED_KEY:-}
      VFSYNC_TIMEZONE: ${VFSYNC_TIMEZONE:-Europe/Berlin}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      BASE_URL: ${BASE_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 3

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 10s
      retries: 3

volumes:
  pgdata:
  redisdata:
  letsencrypt:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /etc/letsencrypt
